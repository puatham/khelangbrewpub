services:
  traefik:
    image: "traefik"
    restart: always
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.mytlschallenge.acme.tlschallenge=true"
      - "--certificatesresolvers.mytlschallenge.acme.email=${SSL_EMAIL}"
      - "--certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./data/traefik:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro

  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: always
    ports:
      - "127.0.0.1:5678:5678"
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`${SUBDOMAIN}.${DOMAIN_NAME}`)
      - traefik.http.routers.n8n.tls=true
      - traefik.http.routers.n8n.entrypoints=web,websecure
      - traefik.http.routers.n8n.tls.certresolver=mytlschallenge
      - traefik.http.middlewares.n8n.headers.SSLRedirect=true
      - traefik.http.middlewares.n8n.headers.STSSeconds=315360000
      - traefik.http.middlewares.n8n.headers.browserXSSFilter=true
      - traefik.http.middlewares.n8n.headers.contentTypeNosniff=true
      - traefik.http.middlewares.n8n.headers.forceSTSHeader=true
      - traefik.http.middlewares.n8n.headers.SSLHost=${DOMAIN_NAME}
      - traefik.http.middlewares.n8n.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.n8n.headers.STSPreload=true
      - traefik.http.routers.n8n.middlewares=n8n@docker
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_HOST=${SUBDOMAIN}.${DOMAIN_NAME}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_RUNNERS_ENABLED=true
      - NODE_ENV=production
      - WEBHOOK_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      # n8n ต้องได้ทั้งสองตัว: GENERIC_TIMEZONE คุมตาราง cron ส่วน TZ คุมเวลาที่ Node
      # แสดงผล ถ้าตั้งแค่ตัวแรก container จะเป็น UTC แล้วเวลาที่โผล่ในหน้า executions
      # ช้ากว่าเวลาไทย 7 ชม. (ตารางรันถูกต้อง ผิดแค่ที่แสดง — เจอจริง 9 ก.ย.)
      - TZ=${GENERIC_TIMEZONE}
      - N8N_PROXY_HOPS=1
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      - RAPT_USERNAME=${RAPT_USERNAME}
      - RAPT_API_SECRET=${RAPT_API_SECRET}
      - DISCORD_APPLICATION_ID=${DISCORD_APPLICATION_ID}
      - DISCORD_PUBLIC_KEY=${DISCORD_PUBLIC_KEY}
      - BREWFATHER_USER_ID=${BREWFATHER_USER_ID}
      - BREWFATHER_API_KEY=${BREWFATHER_API_KEY}
    volumes:
      - ./data/n8n:/home/node/.n8n
      - /local-files:/files
    depends_on:
      - postgresql

  # =====================================================================
  # Grafana — แดชบอร์ดดูข้อมูล Pill/ตู้ควบคุม เปิดออกอินเทอร์เน็ต
  #
  # ต่อ Postgres ด้วย user grafana_ro ที่ SELECT ได้อย่างเดียว ไม่ใช่ root —
  # ของที่เปิดออกเน็ตไม่ควรถือสิทธิ์เขียนฐานข้อมูลการหมักทั้งก้อน
  #
  # **จุดที่พลาดกันบ่อย**: บัญชีที่ใช้เป็น @gmail.com ถ้าตั้ง
  # GF_AUTH_GOOGLE_ALLOWED_DOMAINS=gmail.com จะกลายเป็นเปิดให้บัญชี Google
  # ทุกบัญชีในโลกเข้าได้ (มันกรองที่ "โดเมน" ไม่ใช่ที่อีเมล) จึงใช้วิธีปิดสมัคร
  # อัตโนมัติแทน แล้วให้ล็อกอินสำเร็จเฉพาะอีเมลที่มี user อยู่แล้วเท่านั้น
  # =====================================================================
  grafana:
    image: grafana/grafana:11.6.1
    restart: always
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`${GRAFANA_HOST}`)
      - traefik.http.routers.grafana.tls=true
      - traefik.http.routers.grafana.entrypoints=web,websecure
      - traefik.http.routers.grafana.tls.certresolver=mytlschallenge
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    environment:
      - GF_SERVER_ROOT_URL=https://${GRAFANA_HOST}
      - GF_SERVER_DOMAIN=${GRAFANA_HOST}
      # admin แบบรหัสผ่านเก็บไว้เป็นทางสำรอง เผื่อ Google OAuth ล่มแล้วเข้าไม่ได้เลย
      # อีเมลของ admin ตั้งเป็น Gmail ของผู้ใช้ พอ login ด้วย Google อีเมลตรงกัน
      # Grafana จะ map เข้าบัญชี admin เดิม ไม่ได้สร้างบัญชีใหม่
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
      - GF_SECURITY_ADMIN_EMAIL=${GF_ADMIN_EMAIL}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_GOOGLE_ENABLED=true
      - GF_AUTH_GOOGLE_CLIENT_ID=${GF_GOOGLE_CLIENT_ID}
      - GF_AUTH_GOOGLE_CLIENT_SECRET=${GF_GOOGLE_CLIENT_SECRET}
      - GF_AUTH_GOOGLE_SCOPES=openid email profile
      - GF_AUTH_GOOGLE_AUTH_URL=https://accounts.google.com/o/oauth2/v2/auth
      - GF_AUTH_GOOGLE_TOKEN_URL=https://oauth2.googleapis.com/token
      - GF_AUTH_GOOGLE_API_URL=https://openidconnect.googleapis.com/v1/userinfo
      # ตัวสำคัญ — อีเมลที่ยังไม่มี user ใน Grafana จะถูกปฏิเสธ ไม่สร้างให้อัตโนมัติ
      - GF_AUTH_GOOGLE_ALLOW_SIGN_UP=false
      # จำเป็นคู่กับบรรทัดบน — ตั้งแต่ Grafana 9.3 (CVE-2023-3128) การจับคู่ล็อกอิน OAuth
      # เข้ากับ user เดิม "ด้วยอีเมล" ถูกปิดเป็นค่าเริ่มต้น ผลคือ Google ยืนยันตัวตนผ่าน
      # แล้ว Grafana ยังพยายามสร้าง user ใหม่ ซึ่งโดน allow_sign_up=false บล็อกอีกที
      # → ล็อกอินไม่ได้เลยทั้งที่ตั้งค่าถูกทุกอย่าง (เจอจริง 10 ก.ย.)
      #
      # ชื่อมัน "insecure" เพราะถ้าใช้หลาย identity provider เจ้าที่ไม่ตรวจสอบอีเมลจะ
      # อ้างอีเมลของคนอื่นแล้วยึดบัญชีได้ ที่นี่ไม่เข้าเงื่อนไขนั้น: มี provider เดียวคือ
      # Google ซึ่งตรวจสอบความเป็นเจ้าของอีเมลจริง, แอปอยู่สถานะ Testing ที่ระบุ test user
      # ไว้แล้ว, และ sign-up ยังปิดอยู่ — คนที่จะเข้าได้ต้องคุมบัญชี Google นั้นจริงๆ
      - GF_AUTH_OAUTH_ALLOW_INSECURE_EMAIL_LOOKUP=true
      - GF_DB_PASSWORD=${GF_DB_PASSWORD}
      - TZ=${GENERIC_TIMEZONE}
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - postgresql

  postgresql:
    image: postgres:17
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
